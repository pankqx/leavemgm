# Nginx site for a single EC2 server:
#   - serves the built Angular app from /var/www/leavemgm
#   - forwards /api/* to the Node API listening on 127.0.0.1:3000
# Install:  sudo cp nginx-leavemgm.conf /etc/nginx/sites-available/leavemgm
#           sudo ln -s /etc/nginx/sites-available/leavemgm /etc/nginx/sites-enabled/leavemgm
#           sudo rm /etc/nginx/sites-enabled/default
#           sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;   # replace with your domain once you have one (certbot then adds HTTPS)

    root /var/www/leavemgm;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # API -> Node
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed Angular bundles can be cached for a long time
    location ~* \.(?:js|css|woff2?|svg|png|jpg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Angular router: any other path must return index.html so deep links and refreshes work
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
